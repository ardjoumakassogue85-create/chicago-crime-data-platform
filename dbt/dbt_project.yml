name: 'chicago_crime'
version: '1.0.0'
config-version: 2

# Profile à utiliser (cf. profiles.yml)
profile: 'chicago_crime'

# Dossiers
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configuration des modèles
models:
  chicago_crime:
    # Staging : vues, schéma "staging"
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    
    # Intermediate : vues, schéma "intermediate"
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]
    
    # Marts : tables physiques (matérialisées), schéma "marts"
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]
      
      core:
        +tags: ["core"]
      
      analytics:
        +tags: ["analytics"]